  - id: ovh
    name: OVHcloud AI Endpoints
    free_tier: anonymous
    recommended: false
    why_not: "Works without a key; a key is pay-per-token."
    confidence: seen
    what_you_get: >-
      Without a key: the OVH models at a published 2 requests/minute per IP address and per model (in practice the
      router measured far less on 2026-11-21: one request per model per year). With a key: 400 requests/minute per
      project and per model, but paid per token; there is no free allowance with a key.
    needs: Nothing for anonymous use.
    time_minutes: 0
    signup_url: https://www.ovhcloud.com/en-gb/public-cloud/ai-endpoints/
    keys_url: https://www.ovhcloud.com/en-gb/public-cloud/
    key_var: OVH_AI_ENDPOINTS_ACCESS_TOKEN
    steps:
      - Nothing to do. The pool calls OVH without a key; there is no free key to get.
    key_format: Not documented.
    gotchas:
      - "Getting a key is not part of setting the pool up: an OVH key is pay-per-token (it needs a Public Cloud project with a payment method, and every request with it is billed). If you already have one and accept paying, it can be saved and is then used."
