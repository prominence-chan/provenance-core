  - id: openrouter
    name: OpenRouter
    free_tier: free
    confidence: docs-only
    what_you_get: >-
      Every model whose id ends in `:free` (Nemotron, Gemma, ERNIE and others): 20 requests/minute and 50
      requests/day in total, or 1,000 requests/day once the account has bought at least 10 credits (US$10) in all.
    needs: An OpenRouter account, age 18 or over (the sign-in options could not be read without signing in). No card for the 50/day allowance; a one-time US$10 purchase for 1,000/day.
    time_minutes: 4
    signup_url: https://openrouter.ai
    keys_url: https://openrouter.ai/settings/keys
    key_var: OPENROUTER_API_KEY
    steps:
      - Open https://openrouter.ai/settings/keys and sign up or sign in.
      - Create a new key on that page (the button's label could not be read without signing in).
      - Give it a name such as `provenance` and choose a credit limit or no limit, as the form asks.
      - Copy the key and paste it into the app.
      - Open https://openrouter.ai/settings/privacy and, under the settings for free models, allow providers that may train on your data, if you accept that; without it many `:free` models are not routed to and the request fails.
    key_format: "`sk-or-v1-` followed by 64 lowercase hexadecimal characters (73 characters in all)."
    key_pattern: "^sk-or-v1-[0-9a-f]{64}$"
    gotchas:
      - The 50 (or 1,000) requests/day is one allowance across all `:free` models, not per model.
      - "Many free models are served by providers that log or train on prompts; OpenRouter only routes to them when you switch that on in the privacy settings (\"There are separate settings for paid and free models\")."
      - A negative credit balance causes errors on free models too.
      - "A key made for you during onboarding has a US$100 credit limit and expires after 180 days; a key you create yourself has the limit you give it."
      - OpenRouter's terms say credits must be bought to call the API, while its docs describe the free allowance above; the docs are what the limits follow today.
    terms_note: OpenRouter's terms forbid creating several accounts to get round usage limits and reselling API access.
    checked: 2026-11-23
    sources:
      - https://openrouter.ai/docs/api-reference/limits
      - https://openrouter.ai/docs/api-reference/authentication
      - https://openrouter.ai/docs/faq
      - https://openrouter.ai/docs/guides/privacy/provider-logging
      - https://openrouter.ai/docs/guides/privacy/data-collection
      - https://openrouter.ai/docs/guides/routing/model-variants/free
      - https://openrouter.ai/terms
      - https://openrouter.ai/api/v1/models

  - id: cloudflare
    name: Cloudflare Workers AI
    free_tier: free
    confidence: seen
    what_you_get: >-
      @cf/openai/gpt-oss-120b, @cf/qwen/qwen3.8-27b, @cf/nvidia/nemotron-3-120b-a12b and @cf/zai-org/glm-4.7-flash:
      10,000 Neurons per day for the whole account across all models (resets at 00:00 UTC), 300 requests/minute.
    needs: A Cloudflare account. No card on the Workers Free plan (the sign-up page itself could not be read).
    time_minutes: 5
    signup_url: https://dash.cloudflare.com/sign-up/workers-and-pages
    keys_url: https://dash.cloudflare.com/?to=/:account/ai/workers-ai
    key_var: CLOUDFLARE_API_TOKEN
    steps:
      - Sign up or log in, then open the **Workers AI** page of the dashboard (https://dash.cloudflare.com/?to=/:account/ai/workers-ai).
      - Select **Use REST API**.
      - Select **Create a Workers AI API Token** and review the prefilled information (leave it as it is).
      - Select **Create API Token**, then **Copy API Token**. Paste it into the app as the token; it is shown only once.
      - Back on the same page, under **Get Account ID**, copy the value for **Account ID** and paste it into the app as the account id.
    key_format: "The token starts with `cfut_` (a user token; `cfat_` for an account token) followed by 40 characters and a checksum. Tokens made before 2026 are 40 letters and digits with no prefix."
    key_pattern: "^(cf[ua]t_\\S{40,}|[A-Za-z0-9_-]{40})$"
    extra_fields:
      - var: CLOUDFLARE_ACCOUNT_ID
        label: Account ID
        where: "On the Workers AI page under **Use REST API** > **Get Account ID**. Also: **Workers & Pages** > the **Account Details** section > the copy button next to **Account ID**; or on Account home, search (Ctrl/Cmd + K) for **Copy account ID**."
        format: "A string of letters and digits (not your email, not the token)."
    gotchas:
      - Two values are needed. The account id goes into the address the router calls; the token alone does nothing.
      - "If you make the token by hand instead (**My Profile** > **API Tokens** > **Create Token**), it needs both `Workers AI - Read` and `Workers AI - Edit`; then **Continue to summary** > **Create Token**."
      - "The token secret is \"only shown once\". Token expiration is optional; leave it empty unless you want the key to stop working."
      - On the Workers Free plan, requests fail once the day's 10,000 Neurons are used; nothing is billed.
      - "Cloudflare says it \"does not use Customer Content processed by Workers AI to train AI models\"."
      - Some newer models need a paid billing method; the four in the catalog were not on that list on the checked date.
    checked: 2026-11-23
    sources:
      - https://developers.cloudflare.com/workers-ai/get-started/rest-api/
      - https://developers.cloudflare.com/workers-ai/platform/pricing/
      - https://developers.cloudflare.com/workers-ai/platform/limits/
      - https://developers.cloudflare.com/workers-ai/platform/data-usage/
      - https://developers.cloudflare.com/workers-ai/configuration/open-ai-compatibility/
      - https://developers.cloudflare.com/fundamentals/api/get-started/create-token/
      - https://developers.cloudflare.com/fundamentals/api/get-started/token-formats/
      - https://developers.cloudflare.com/fundamentals/account/find-account-and-zone-ids/

