    key_var: NVIDIA_API_KEY
    steps:
      - Open https://build.nvidia.com and click **Login** at the top right ("Sign In to Get Started with NVIDIA AI").
      - Type your email into **Enter your email ID** and click **Next**.
      - "On **Your NVIDIA Account**, enter your password, or use **Log In With Passkey** or **More Login Options** (Log In With Google, Apple, Microsoft, Discord or Facebook; **Show More** for others)."
      - If NVIDIA shows a page saying it has sent a confirmation to your email, open that email and approve it, then come back.
      - NVIDIA may offer **Create A Passkey** (choose **Maybe Later**, then **OK**) and "Secure my account" (choose **Not now**); both can be skipped.
      - On "Almost done!" leave the two optional boxes unticked if you do not want recommendations or developer news, and click **Submit**.
      - On **Create an NVIDIA Cloud Account** type any name (for example `provenance`) and click **Create NVIDIA Cloud Account**.
      - "Back on build.nvidia.com a dialog says **We'll need to verify your phone number**: choose your **Location**, type your **Phone Number**, click **Send Code to Phone** and enter the code. (A bar at the top says \"Please verify your account to get API access\" with **Verify** until this is done.)"
      - Generate the API key; it is shown once, with its ID, name and expiration. Copy it and paste it into the app.
    key_format: Starts with `nvapi-`.
    key_pattern: "^nvapi-[A-Za-z0-9_-]{40,}$"
    gotchas:
      - "The steps above were walked on the checked date up to the phone verification; the last step (generating the key) was done by the account's owner. NVIDIA's only written walkthrough is old: it puts **Get API Key** in the right-hand pane of a model's page, but a model page now shows a **Deploy** pane with paid partner endpoints instead."
      - "Only models marked **Free Endpoint** are free: the Models page has that filter (https://build.nvidia.com/models?filters=nimType%3Anim_type_preview). A model's page says so under **Model Availability**; meta/llama-3.3-70b-instruct now says \"Free Endpoint: Deprecated\" and is no longer in the pool."
      - The current model ids are on https://integrate.api.nvidia.com/v1/models, which needs no key.
      - "Access is \"for prototyping, research, development and testing purposes only\", not production, which NVIDIA defines as \"any non-testing activity including activity serving real end-users\"."
      - "The key is shown only once, is \"for API testing use only\" and is valid for 6 months: set a reminder to make a new one."
      - NVIDIA's own pages do not say how free-tier prompts are used; through Kilo, NVIDIA's free endpoints are described as logged "to improve NVIDIA products and services".
    terms_note: Free access through the Developer Program is for prototyping and testing only; production use needs an NVIDIA AI Enterprise license.
    multiple_keys:
      allowed: check_terms
      note: "NVIDIA's API catalog terms could not be read on the checked date (the page timed out); read them before adding a second account's key."
    checked: 2026-11-23
    sources:
      - https://docs.api.nvidia.com/nim/docs/api-quickstart
      - https://docs.api.nvidia.com/nim/docs/product
      - https://docs.api.nvidia.com/nim/reference/llm-apis
      - https://build.nvidia.com/
      - https://forums.developer.nvidia.com/t/nvidia-nim-faq/300317
      - https://build.nvidia.com/models
      - https://integrate.api.nvidia.com/v1/models

  - id: cohere
    name: Cohere
    free_tier: free
    confidence: docs-only
    what_you_get: >-
      command-a-plus-05-2026 with a trial key: 1,000 API calls a month in total and 20 requests/minute on Chat.
    needs: A Cohere account (email and password, or Google or GitHub sign-in). No card. Not available from Belarus, China (with Hong Kong and Macau), Iran, North Korea, Russia or Syria.
    time_minutes: 3
    signup_url: https://dashboard.cohere.com/welcome/register
    keys_url: https://dashboard.cohere.com/api-keys
    key_var: COHERE_API_KEY
    steps:
      - Open https://dashboard.cohere.com/welcome/register and sign up with **Continue with Google**, **Continue with Github**, or an email and password.
      - A trial key is created for you automatically. Open **API Keys** in the dashboard (https://dashboard.cohere.com/api-keys).
      - Copy the trial key (not a production key, which is billed) and paste it into the app.
      - "Optional: under **Settings** > **Data Controls**, switch the toggle off so your prompts are not used to train Cohere's models."
    key_format: Not documented.
    gotchas:
      - "Cohere: trial keys \"are not permitted to be used for production or commercial purposes\"."
      - 1,000 calls a month is about 33 a day.
      - Prompts and generations may be used to train Cohere's models unless you opt out under **Data Controls**; Cohere says it deletes them after 30 days.
      - A production key is pay-as-you-go; the pool only needs the trial key.
    terms_note: Trial keys are for evaluation, not production or commercial use; Cohere's agreement also forbids sharing access with others.
    multiple_keys:
      allowed: "no"
      note: "Cohere's terms of use: you agree to \"not register for more than one account\"."
    checked: 2026-11-23
    sources:
      - https://docs.cohere.com/docs/rate-limits
      - https://docs.cohere.com/docs/going-live
      - https://docs.cohere.com/docs/compatibility-api
      - https://docs.cohere.com/docs/models
