      - https://cohere.com/data-usage-policy
      - https://cohere.com/saas-agreement
      - https://cohere.com/terms-of-use
      - https://dashboard.cohere.com/welcome/register

  - id: sambanova
    name: SambaNova (SambaCloud)
    free_tier: free
    confidence: docs-only
    setup: person
    why_person: The new-account onboarding asks for your name, job title and company and has a payment step, so this one is done by you, not by the assistant.
    what_you_get: >-
      gpt-oss-120b and gemma-4-31B-it on the Free Tier: each 20 requests/minute, 20 requests/day and 200,000
      tokens/day. Small, and a new account may now be asked for payment details (see below).
    needs: A SambaCloud account, with your first and last name, job title and company name. Possibly payment details (not known whether that step can be skipped). The docs say no card; linking one moves the account to the Developer Tier (60 requests/minute, 12,000 requests/day, pay per token).
    time_minutes: 3
    signup_url: https://cloud.sambanova.ai
    keys_url: https://cloud.sambanova.ai/apis
    key_var: SAMBANOVA_API_KEY
    steps:
      - Open https://cloud.sambanova.ai/apis and sign up or log in (**Login/Signup**).
      - "A new account lands on \"Welcome! Set up your account in a few quick steps\": **Profile**, **Payment**, **Credits**. On **Profile**, fill in **First Name**, **Last Name**, **Job Title** and **Company Name** (Email and Country are filled in, Contact Number is optional) and click **Save**."
      - "On **Payment**: whether this step can be skipped is not known. Do not enter a card unless you mean to pay: a linked payment method moves the account off the Free Tier. If it cannot be skipped, stop here and skip this provider."
      - On the **API Keys** page generate a key (the button's label could not be read without signing in).
      - Copy the key at once and paste it into the app; it cannot be viewed again.
    key_format: Not documented.
    gotchas:
      - 20 requests a day per model is the whole free allowance.
      - The onboarding (Profile, Payment, Credits) was seen on the checked date up to the Profile form; what Payment and Credits ask for was not.
      - The Free Tier applies only while no payment method is linked to the account.
      - "SambaNova: all SambaCloud models are Preview models, \"intended for evaluation purposes and developer experimentation only\", and \"may be removed at short notice\"."
      - A key is shown once; an account can have up to 25 keys.
      - How free-tier prompts are used is not stated on the pages read (the terms page linked from older docs is gone).
    multiple_keys:
