      - If you have an account, open https://platform.inceptionlabs.ai and log in.
      - Open the API keys page of the dashboard (https://platform.inceptionlabs.ai/dashboard/api-keys) and generate a key (the labels there could not be read).
      - Copy the key and paste it into the app.
      - "Optional: under **User Settings**, set **Improve the model for everyone** to OFF so your prompts are not used for training."
    key_format: Not documented.
