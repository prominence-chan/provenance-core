# How to get a free API key from each provider in the token pool. Served by GET /pool/help (pool_help.py) and
# rendered to docs/pool-keys.md by `python -m provenance_core.pool_help` (a test keeps the two the same).
#
# Order: the most free capacity for the least effort first. Everything here was read from the providers' own public
# pages on the `checked` date, without signing in anywhere: free tiers, labels and limits change often, so the page
# in front of the person wins over this file.
#
# confidence:
#   seen       the provider's current documentation spells out the controls by their labels
#   docs-only  the docs say where the key is made, but the page is behind a sign-in and its labels could not be read;
#              steps name only what the docs name
#   uncertain  the only walkthrough found is dated, or the docs contradict each other
# free_tier: anonymous (no key at all) | free (a standing free allowance) | trial (one-time credit or tokens) | none
# key_var / extra_fields[].var are the names to send to PUT /pool/keys/{id} as {"values": {"<var>": "<value>"}}.
checked: 2026-11-23
assistant_notes:
  - Walk the person through one provider at a time, in this order; skip any whose `needs` they cannot meet.
  - The person does every click themselves. Never create an account, sign in, accept terms or request a key for them.
  - The key goes into the app's key field for that provider (or PUT /pool/keys/{id}); do not ask for it in chat and
    never repeat, log or store it anywhere else.
  - Check a pasted value against `key_format` / `key_pattern` before saving, to catch a paste of the wrong thing.
  - Where a step here does not match the page, trust the page and say so; `confidence` tells how likely that is.
  - Tell the person each provider's `gotchas` (card, expiry, training on their prompts) before they start.

providers:
  - id: kilo
    name: Kilo AI Gateway
    free_tier: anonymous
    confidence: seen
    what_you_get: >-
      The gateway's free models (the `:free` Nemotron, ERNIE, Flint, Particle, Ling models and others) with no
      account and no key: 200 requests per hour per IP address, shared by all free models.
    needs: Nothing. No account, no key.
    time_minutes: 0
    signup_url: https://app.kilo.ai
    keys_url: https://app.kilo.ai
    key_var: null
    steps:
      - Nothing to do. The pool calls Kilo's free models without a key and they work as soon as the router runs.
      - "Optional, and not used by the pool: a Kilo account has a key. Go to **app.kilo.ai**, open **Your Profile** on your personal account (not an organization), scroll to the bottom of the page and copy your API key."
    key_format: "Not needed. A Kilo account key is a JWT (three dot-separated parts, starting `eyJ`)."
    gotchas:
      - The 200 requests/hour limit is per IP address and is the same signed in or not, so a key adds nothing for free models.
      - "Kilo's docs on the NVIDIA free endpoints: \"Trial use only - do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.\""
      - Other free models may be routed to providers that log prompts and outputs and use them to improve their services.
      - Which models are free changes; the live list is https://ai-gateway.kilo.ai/api/v1/models (all the catalog's Kilo models were on it on the checked date).
    terms_note: Kilo's terms allow one account per person or entity; if you route other people's requests through the gateway you are responsible for their compliance with the terms.
    checked: 2026-11-23
    sources:
      - https://kilo.ai/docs/gateway/authentication
      - https://kilo.ai/docs/gateway/usage-and-billing
      - https://kilo.ai/docs/gateway/models-and-providers
      - https://kilo.ai/docs/gateway/api-reference
      - https://kilo.ai/docs/getting-started/setup-authentication
      - https://kilo.ai/terms
      - https://ai-gateway.kilo.ai/api/v1/models

  - id: google
    name: Google Gemini API (Google AI Studio)
    free_tier: free
    confidence: seen
    what_you_get: >-
      The Gemini Flash and Flash-Lite models, Gemini 4 Hydrogen and Gemma, free of charge on the free tier. The
      per-model requests/minute and requests/day are unstated in the docs: they are shown per project on
      https://aistudio.google.com/rate-limit after signing in. Gemini 4 Carbon, Argon and Neon are not on the free tier.
    needs: A Google account, age 18 or over, a supported country. Some accounts are asked for a one-time phone check (scan a QR code; no phone number is given). No card.
    time_minutes: 3
    signup_url: https://aistudio.google.com
    keys_url: https://aistudio.google.com/api-keys
    key_var: GEMINI_API_KEY
    steps:
      - Open https://aistudio.google.com/api-keys and sign in with your Google account.
      - Accept the Terms of Service when asked. For a new user AI Studio then creates a default Google Cloud project and an API key by itself.
      - If no key is listed, click **Create API key**.
      - If AI Studio asks for verification, scan the QR code it shows with your phone and follow it through.
      - Copy the key from the API Keys page and paste it into the app.
    key_format: "Not documented. Keys made since 2026-05-28 are \"auth keys\"; expect one long string with no spaces."
    gotchas:
      - "Free-tier prompts and answers are used by Google: \"Google uses the content you submit to the Services and any generated responses to provide, improve, and develop Google products and services and machine learning technologies\", and \"human reviewers may read, annotate, and process your API input and output\". Google says not to submit sensitive, confidential or personal information to the unpaid service."
      - In the EEA, Switzerland and the UK the paid-service data terms apply to the free quota too (no such use of your content).
      - Limits are per project, not per key, so a second key in the same project adds nothing.
      - If you already have a Google Cloud account, AI Studio creates no default project; import one under **Dashboard** > **Projects** > **Import projects**, then create the key on the **API Keys** page. An imported project may need the phone verification before it gets the free tier.
      - Do not attach a Cloud Billing account to the project unless you mean to pay; with billing on, the project is on the paid tier.
      - Flash models often answer 503 under load; the router treats that as temporary.
    terms_note: Google's terms say the API is "for developers building with Google AI models for professional or business purposes, not for consumer use", require age 18+, and allow only paid services when you make a client available to users in the EEA, Switzerland or the UK.
    checked: 2026-11-23
    sources:
      - https://aistudio.google.com/docs/api-key
      - https://aistudio.google.com/docs/verification
      - https://aistudio.google.com/docs/rate-limits
      - https://aistudio.google.com/docs/pricing
      - https://aistudio.google.com/docs/available-regions
      - https://aistudio.google.com/docs/terms
      - https://aistudio.google.com/docs/openai

