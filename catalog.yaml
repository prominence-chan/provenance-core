# Providers: OpenAI-compatible chat endpoints with a free tier. `api_key_env` names the variable holding the
# provider's first key, from your own account; further keys from other accounts of yours are added from the app
# (POST /pool/keys/{provider}; pool_keys.py), and limits are then counted per key. `api_key_env: none` = anonymous
# access only (no Authorization header); `auth: none` = anonymous access, with a key sent when there is one.
# `${VAR}` in base_url comes from the key's own extras, else the environment. `pool` = limits shared by all of a
# provider's models (per key; `pool_per: ip` = per machine, whatever key is sent); `shared_tpd: true` = each
# model's tpd is its share of one account-wide daily allowance. `until: <date>` = the last day the provider is
# used (a service that is shutting down). `check` = a GET that tells whether a key is valid without spending quota
# (`path` under the base URL, or `url`; `soft: true` = a refusal is reported but the key is still tried).
# Models: `score` is a prior (0-100) until `python -m provenance_core calibrate` measures it; limits are the free-tier caps
# as published by each provider (check and adjust: they change often). Use `python -m provenance_core discover <provider>`
# to see current model names. Several providers reshuffled their free tiers in late 2026 (Groq trimmed chat models),
# so treat the non-OpenRouter entries as a starting point and re-run discover. Removed 2026-11-23, no longer free:
# Mistral (no free API tier; a key needs billing) and Cerebras (a card for a one-time credit, no standing free
# tier); provenance_core/pool_help.yaml `removed:` has the reasons, and a key saved for either is ignored.
# Tiers are named from a spark up to a nova, hottest first. Clients use the tier name as the
# model: "nova" is a pooled hyperfrontier model, "solstice" a pooled frontier one, and so on. Floors are calibrated
# scores (the probe set's hard half is what separates nova from solstice).
tiers:
  - {name: nova, min_score: 94}   # hyperfrontier: only the very strongest models
  - {name: solstice,  min_score: 82}   # frontier: solid agentic coding / reasoning
  - {name: ember,  min_score: 62}   # strong mid: good for edits, summaries, tool plumbing
  - {name: spark, min_score: 0}    # fast / small: classification, routing, cheap bulk work

# History pruning (prune.py): repeated file reads, stale reads, bulky write feedback and long old outputs are cut
# from the history. On for the web bridge (applied only to the prompt that starts a new chat); off for API models.
prune: {web: true}
# Context compaction (compact.py): when a new web chat cannot take the whole history, the old part becomes a brief
# (the user's messages, changed files and their state, failures, the last plan) instead of being cut blindly.
compact: {web: true}

aliases: {corona: nova, flare: solstice, supernova: nova, blaze: solstice, cinder: spark, tier-1: nova, tier-2: solstice, tier-3: ember, tier-4: spark, auto: solstice, default: solstice}

providers:
  google:     {base_url: "https://generativelanguage.googleapis.com/v1beta/openai", api_key_env: GEMINI_API_KEY, check: {path: /models}}
  groq:       {base_url: "https://api.groq.com/openai/v1", api_key_env: GROQ_API_KEY, check: {path: /models}}
  # OpenRouter: 20 requests/minute and 50 requests/day across ALL :free models of an account (1000/day once it has
  # bought 10 credits: give that key `limits: {rpd: 1000}` from the app). GET /key answers for a valid key only.
  openrouter: {base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, pool: {rpm: 20, rpd: 50},
               check: {url: "https://openrouter.ai/api/v1/key"}}
  nvidia:     {base_url: "https://integrate.api.nvidia.com/v1", api_key_env: NVIDIA_API_KEY}
  # Workers AI: 10k neurons/day per account across all models; each model's tpd below is its token-equivalent share
  # (10,000 neurons at the model's output price). Each further key carries its own account id (its `extras`).
  cloudflare: {base_url: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1", api_key_env: CLOUDFLARE_API_TOKEN, shared_tpd: true,
               check: {url: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/models/search?per_page=1", soft: true}}
  # Kilo: anonymous, 200 requests/hour per IP address across all free models, the same signed in or not (so the
  # pool counts per machine, not per key). A Kilo account's key is sent when one is set; it adds no free capacity.
  kilo:       {base_url: "https://ai-gateway.kilo.ai/api/v1", auth: none, api_key_env: KILO_API_KEY, pool: {rph: 200}, pool_per: ip}
  # OVHcloud AI Endpoints: anonymous works without any auth header, but on 2026-11-21 the anonymous quota measured
  # 1 request per model per IP per calendar year (x-ratelimit-limit-year: 1; 429 retry-after until Jan 1), not the
  # published 2 rpm. An access token in OVH_AI_ENDPOINTS_ACCESS_TOKEN is sent if set.
  ovh:        {base_url: "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1", auth: none, api_key_env: OVH_AI_ENDPOINTS_ACCESS_TOKEN}
  zai:        {base_url: "https://api.z.ai/api/paas/v4", api_key_env: ZAI_API_KEY}
  sambanova:  {base_url: "https://api.sambanova.ai/v1", api_key_env: SAMBANOVA_API_KEY}
  cohere:     {base_url: "https://api.cohere.ai/compatibility/v1", api_key_env: COHERE_API_KEY}
  # Inception is winding the Mercury API down: no access after 2026-12-28, and new sign-ups are closed (seen
  # 2026-11-23). Kept until then for people who already have a key; the router stops offering its models the day
  # after.
  inception:  {base_url: "https://api.inceptionlabs.ai/v1", api_key_env: INCEPTION_API_KEY, until: 2026-12-28}
  # Requesty gateway (added 2026-11-23, not yet tried with a key): its free models, 200 requests/day and 20/minute
  # per organization across all of them; held a little under that here.
  requesty:   {base_url: "https://router.requesty.ai/v1", api_key_env: REQUESTY_API_KEY, pool: {rpm: 15, rpd: 180}}
  # ChatGPT web: your own signed-in chatgpt.com as a stateless completion engine, one new temporary chat per request,
  # driven through a visible Chrome window on its own profile. OFF unless PCORE_CHATGPT_WEB=1 (or `enabled: true`
  # here). Sign in once with `provenance-core weblogin`. Against OpenAI's terms for the web app: the account can be
  # limited or banned, so it is slow on purpose (one request at a time, a pause between requests, a daily cap).
  # Only /v1/responses tier requests (Provenance, Codex) and requests naming the model use it; see docs/TECHNICAL.md.
  # `driver: patchright` under web: (or PCORE_CHATGPT_WEB_DRIVER=patchright) gets past the site's automatic browser
  # check by not announcing the automation; the default `playwright` driver is stopped by it.
  chatgpt-web: {type: chatgpt_web, base_url: "https://chatgpt.com", api_key_env: none,
                web: {daily_cap: 1000, min_gap_s: 4, max_gap_s: 9, endpoints: [responses],
                      allow_auto_fallback: true, reuse_chat: true, max_chat_tabs: 6,
                      # daily_cap is per account. lean: a few lines instead of the harness's 18k base prompt.
                      lean: true, quiet: true, idle_close_s: 21600, accounts: [main, b, c],
                      # the bridge's own background-only browser (browser_host.py): no Dock icon, never takes focus
                      browser: bundled}}
  # Z.ai web (chat.z.ai) through the same bridge (`site: zai`). `share: chatgpt-web` = no Chrome of its own: it works
  # as extra tabs in the chatgpt-web accounts' windows (so a Z.ai sign-in is done in those profiles). Without a
  # sign-in it is the guest page, which offers GLM-5.3-Flash only (GLM-5.3 and 5.2 need an account).
  zai-web: {type: chatgpt_web, base_url: "https://chat.z.ai", api_key_env: none,
            web: {site: zai, share: chatgpt-web, accounts: [main, b, c], daily_cap: 500, min_gap_s: 2, max_gap_s: 5,
                  endpoints: [responses], reuse_chat: true, max_chat_tabs: 4, lean: true, quiet: true}}
  # Qwen web (chat.qwen.ai, signed in, temporary chats), also as tabs in the chatgpt-web accounts' windows.
  qwen-web: {type: chatgpt_web, base_url: "https://chat.qwen.ai", api_key_env: none,
             web: {site: qwen, share: chatgpt-web, accounts: [main, b, c], daily_cap: 300, min_gap_s: 3, max_gap_s: 7,
                   endpoints: [responses], reuse_chat: true, max_chat_tabs: 4, lean: true, quiet: true,
                   # Qwen4-Max has a small allowance per free account: 6 is a first guess, replaced by the count
                   # reached each time the site says "You've reached today's Qwen4-Max limit"
                   model_caps: {qwen4-max: 6}}}
  # Gemini web (gemini.google.com, signed in, temporary chats), also as tabs in the same windows. `main` is a Pro
  # account (Hydrogen, Neon); `b` and `c` are free accounts with Auto only: see `accounts:` on the models.
  gemini-web: {type: chatgpt_web, base_url: "https://gemini.google.com", api_key_env: none,
               web: {site: gemini, share: chatgpt-web, accounts: [main, b, c], daily_cap: 200, min_gap_s: 3,
                     max_gap_s: 7, endpoints: [responses], reuse_chat: true, max_chat_tabs: 4, lean: true,
                     quiet: true}}

models:
  # ChatGPT web: `model` is the name to pick in the page's model picker ("auto" = whatever the page has selected).
  # The score is a prior until `calibrate --only chatgpt-web/luna` (29 messages through the page) measures it.
  - {provider: chatgpt-web, model: luna, score: 93, context: 64000, label: "GPT-6 Luna"}   # 93 = top of solstice (the default tier), by request 2026-11-21; was 95 (nova)
  # Other web chats (priors until measured through the page; see the providers above).
  - {provider: qwen-web, model: qwen4-max, score: 93, context: 64000, label: "Qwen4-Max"}   # measured 100 on the probe set 2026-11-21 (29 of 29); held at 93 = top of solstice, like luna
  - {provider: qwen-web, model: qwen3.7-plus, score: 50, context: 64000, label: "Qwen3.7-Plus"}
  # Gemini, tiers as asked 2026-11-22 (not measured): Neon in nova, Hydrogen in ember, both on the Pro account;
  # Auto in spark on the two free accounts. Carbon is listed in main's picker but will not select (an upgrade
  # prompt), so it is left out.
  - {provider: gemini-web, model: neon, score: 96, context: 64000, label: "Gemini Neon", accounts: [main]}
