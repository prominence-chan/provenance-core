  - {provider: groq, model: qwen/qwen3.8-27b, score: 76, context: 131072, limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}}
  - {provider: groq, model: openai/gpt-oss-20b, score: 66, context: 131072, limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}}
  # OpenRouter free models (checked against its public /models list, 2026-11-23: all still there): 50 requests/day
