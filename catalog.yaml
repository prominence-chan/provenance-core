# Providers: OpenAI-compatible chat endpoints with a free tier. One API key per provider, from your own account.
# Models: `score` is a prior (0-100) until `python -m tierlm calibrate` measures it; limits are the free-tier caps
# as published by each provider (check and adjust: they change often). Use `python -m tierlm discover <provider>`
# to see current model names. Several providers reshuffled their free tiers in late 2026 (Cerebras moved to a trial
# credit, Groq trimmed chat models), so treat the non-OpenRouter entries as a starting point and re-run discover.
# Tiers are named from a spark up to a nova, hottest first. Clients use the tier name as the
# model: "nova" is a pooled hyperfrontier model, "solstice" a pooled frontier one, and so on. Floors are calibrated
# scores (the probe set's hard half is what separates nova from solstice).
tiers:
  - {name: nova, min_score: 94}   # hyperfrontier: only the very strongest models
  - {name: solstice,  min_score: 82}   # frontier: solid agentic coding / reasoning
  - {name: spark,  min_score: 62}   # strong mid: good for edits, summaries, tool plumbing
  - {name: ember, min_score: 0}    # fast / small: classification, routing, cheap bulk work

aliases: {corona: nova, flare: solstice, supernova: nova, blaze: solstice, cinder: ember, tier-1: nova, tier-2: solstice, tier-3: spark, tier-4: ember, auto: solstice, default: solstice}

providers:
  google:     {base_url: "https://generativelanguage.googleapis.com/v1beta/openai", api_key_env: GEMINI_API_KEY}
  groq:       {base_url: "https://api.groq.com/openai/v1", api_key_env: GROQ_API_KEY}
  cerebras:   {base_url: "https://api.cerebras.ai/v1", api_key_env: CEREBRAS_API_KEY}
  openrouter: {base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
  mistral:    {base_url: "https://api.mistral.ai/v1", api_key_env: MISTRAL_API_KEY}
  nvidia:     {base_url: "https://integrate.api.nvidia.com/v1", api_key_env: NVIDIA_API_KEY}

models:
  # Google AI Studio free tier (2026-11): Flash-class models only; the Pro / Gemini 4 models answer 429 with no
  # free quota. Flash models often return 503 under load, which the router treats as a transient failure.
  - {provider: google, model: gemini-3.8-flash, score: 86, context: 1000000, limits: {rpm: 10, rpd: 250}}
  - {provider: google, model: gemini-3.7-flash, score: 84, context: 1000000, limits: {rpm: 10, rpd: 250}}
  - {provider: google, model: gemini-3.5-flash, score: 82, context: 1000000, limits: {rpm: 10, rpd: 250}}
  - {provider: google, model: gemini-4-hydrogen, score: 84, context: 1000000, limits: {rpm: 5, rpd: 100}}
  - {provider: google, model: gemini-3.5-flash-lite, score: 70, context: 1000000, limits: {rpm: 15, rpd: 1000}}
  - {provider: google, model: gemini-3.1-flash-lite, score: 64, context: 1000000, limits: {rpm: 15, rpd: 1000}}
  - {provider: google, model: gemma-4-31b-it, score: 66, context: 262144, limits: {rpm: 30, rpd: 14400}}
  - {provider: groq, model: openai/gpt-oss-120b, score: 82, context: 131072, limits: {rpm: 30, rpd: 1000, tpm: 8000}}
  - {provider: groq, model: llama-3.3-70b-versatile, score: 62, context: 131072, limits: {rpm: 30, rpd: 1000, tpm: 12000}}
  - {provider: groq, model: llama-3.1-8b-instant, score: 35, context: 131072, limits: {rpm: 30, rpd: 14400, tpm: 6000}}
  - {provider: cerebras, model: gpt-oss-120b, score: 82, context: 65536, limits: {rpm: 30, tpm: 60000, tpd: 1000000}}
  - {provider: cerebras, model: qwen-3-235b-a22b-instruct-2507, score: 80, context: 65536, limits: {rpm: 30, tpm: 60000, tpd: 1000000}}
  # OpenRouter free models (checked against its public /models list, 2026-11): 50 requests/day across all :free
  # models without credits, 1000/day after a one-time $10 top-up
  - {provider: openrouter, model: "nvidia/nemotron-3-ultra-550b-a55b:free", score: 84, context: 1000000, limits: {rpm: 20, rpd: 50}}
  - {provider: openrouter, model: "nvidia/nemotron-3.5-super-vl:free", score: 76, context: 1000000, limits: {rpm: 20, rpd: 50}}
  - {provider: openrouter, model: "baidu/ernie-5.5-flash-preview:free", score: 72, context: 1024000, limits: {rpm: 20, rpd: 50}}
  - {provider: openrouter, model: "google/gemma-4-31b-it:free", score: 68, context: 262144, limits: {rpm: 20, rpd: 50}}
  - {provider: openrouter, model: "inclusionai/ling-3.2-flash:free", score: 60, context: 1048576, limits: {rpm: 20, rpd: 50}}
  - {provider: mistral, model: mistral-large-latest, score: 72, context: 131072, limits: {rpm: 60}}
  - {provider: mistral, model: mistral-small-latest, score: 55, context: 131072, limits: {rpm: 60}}
  - {provider: nvidia, model: deepseek-ai/deepseek-v3.1, score: 78, context: 131072, limits: {rpm: 40}}
  - {provider: nvidia, model: meta/llama-3.3-70b-instruct, score: 62, context: 131072, limits: {rpm: 40}}
