  - {provider: google, model: gemma-4-31b-it, score: 66, context: 262144, limits: {rpm: 30, rpd: 14400}}
  # Groq free plan (its rate-limits page, 2026-11-23): 30 rpm, 1000 rpd, 8000 tpm, 200000 tpd for each of these
