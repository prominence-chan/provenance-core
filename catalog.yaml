  - {provider: chatgpt-web, model: luna, score: 93, context: 64000}   # 93 = top of solstice (the default tier), by request 2026-11-21; was 95 (nova)
  # Z.ai guest, measured 2026-11-21: 53 on the probe set (spark), and the page answers "Error code: 405, try again
  # later" after about 20 messages in a few minutes. Left out of the pool until a signed-in account is tried.
